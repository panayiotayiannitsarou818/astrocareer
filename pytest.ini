[pytest]
; Προσθέτει τη ρίζα του project (τον φάκελο αυτού του αρχείου) στο
; sys.path πριν τη συλλογή των tests, ώστε `from core.validator import ...`,
; `from core.models import ...`, `from core.case_state import ...` κ.λπ. να
; δουλεύουν ανεξάρτητα από τον τρέχοντα φάκελο εκτέλεσης (π.χ. σε CI).
; Απαιτεί pytest>=7. (core/ έγινε πραγματικό πακέτο μετά τον χωρισμό σε
; Home / AstroCheck Analysis / AstroCheck Career -- βλ. README.)
pythonpath = .
testpaths = tests
